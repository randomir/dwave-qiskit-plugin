[build-system]
requires = ["setuptools>=77.0.3"]   # PEP 639
build-backend = "setuptools.build_meta"

[project]
name = "dwave-qiskit-plugin"
dynamic = ["version"]
authors = [
    {name = "D-Wave", email = "tools@dwavesys.com"},
]
description = "Provide access to D-Wave solvers using IBM Qiskit"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-optimization>=0.7",
    "dwave-system>=1.20",
    "dwave-gate>=0.4.0",
]

[project.urls]
Repository = "https://github.com/dwavesystems/dwave-qiskit-plugin.git"
Issues = "https://github.com/dwavesystems/dwave-qiskit-plugin/issues"

[dependency-groups]
changelog = [
    "reno==4.1.0",
]
dev = [
    "qiskit==2.5.2",
    "qiskit-optimization==0.7.0",
    "dwave-system==1.35.0",
    "dwave-gate==0.4.0",
    {include-group = "changelog"},
]
test = [
    "coverage[toml]",
    "parameterized==0.9.0",
    "codecov==2.1.13",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "dwave.plugins.qiskit.__version__"}

[tool.setuptools.packages.find]
include = ["dwave.*"]

[tool.coverage.run]
source = ["dwave/plugins/qiskit"]
omit = [
    "tests/*",
]

[tool.coverage.report]
include_namespace_packages = true
exclude_lines = [
    "pragma: no cover",
]
